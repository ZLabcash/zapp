name: ZFlip
options:
  bundleIdPrefix: cash.zscan
  deploymentTarget:
    iOS: "17.0"
packages:
  ZcashLightClientKit:
    url: https://github.com/zcash/zcash-swift-wallet-sdk
    exactVersion: 3.0.0
settings:
  base:
    DEVELOPMENT_TEAM: FPK7W8HFK9
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ZFlip:
    type: application
    platform: iOS
    sources: [ZFlip]
    dependencies:
      - package: ZcashLightClientKit
      - framework: Frameworks/ZFlipBridge.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cash.zscan.zflip
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "ZApp talks to your Flipper Zero over Bluetooth to sign Zcash transactions."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: ZApp
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
